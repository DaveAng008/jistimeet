<svg width="240" height="42" viewBox="0 0 240 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wealth Mindset & Ascending Growth Emblem -->
  <g transform="translate(6, 4)">
    <!-- Upward Growth Dynamic Chevrons (Ascending Stairs of Wealth) -->
    <path d="M4 26 L16 14 L28 26 L23 26 L16 19 L9 26 Z" fill="url(#goldGrad)" opacity="0.6"/>
    <path d="M7 20 L16 11 L25 20 L22 20 L16 14 L10 20 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Central Rising Arrow & Wealth Diamond -->
    <path d="M16 2 L22 10 L16 18 L10 10 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="16" cy="10" r="2" fill="#FFFFFF"/>
    <!-- Rising Sparkle Star -->
    <path d="M26 3 L27.5 7 L31.5 8.5 L27.5 10 L26 14 L24.5 10 L20.5 8.5 L24.5 7 Z" fill="url(#goldGlow)"/>
  </g>

  <!-- Typography: 创业说明会 -->
  <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">创业说明会</text>
  
  <!-- Sub-label: 富人思维 · 认知觉醒 -->
  <text x="45" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="600" fill="url(#goldGlow)" letter-spacing="2">富人思维 · 认知觉醒 · 财富增长</text>
</svg>
